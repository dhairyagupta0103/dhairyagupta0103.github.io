name: Validate website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check assets/app.js

      - name: Validate content schema
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const content = JSON.parse(fs.readFileSync('content/site.json', 'utf8'));
          assert.ok(content.meta && typeof content.meta === 'object', 'meta must be an object');
          assert.ok(Array.isArray(content.features), 'features must be an array');
          assert.ok(Array.isArray(content.signals), 'signals must be an array');
          assert.ok(['aurora', 'monolith', 'playground', 'terminal'].includes(content.theme), 'theme must be supported');
          for (const [index, item] of content.features.entries()) {
            assert.equal(typeof item.title, 'string', `features[${index}].title must be text`);
            assert.equal(typeof item.description, 'string', `features[${index}].description must be text`);
          }
          console.log('Content JSON and required fields are valid.');
          NODE

      - name: Verify required site files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s content/site.json
          test -s EDITING.md
          test -s SESSION_LOG.md
